# 유튜브 채널에 새 영상이 올라오면 사이트에 자동으로 연결한다(2026-10-06).
#  - 매일 09:30 KST 에 scripts/fetch-channel.mjs --auto --save 실행
#  - 제목에 기종 번호 + 작업명이 있으면 data/manuals.js 의 그 기종 칸에, 아니면 data/new-videos.js(홈 "새로 올라온 영상")에
#  - 바뀐 게 있으면 커밋 → Vercel 이 자동 배포
#  - 수동으로 돌리려면 GitHub → Actions → 이 워크플로 → Run workflow
name: 유튜브 새 영상 자동 연결

on:
  schedule:
    - cron: "30 0 * * *"   # 매일 00:30 UTC = 09:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 채널 읽고 자동 연결
        run: node scripts/fetch-channel.mjs --auto --save
      - name: 검색엔진용 정적 페이지·사이트맵 다시 만들기
        run: node scripts/prerender.mjs
      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manuals.js data/new-videos.js data/channel-videos.json sitemap.xml m b f t fixes fixes.html meter.html pattern.html notices.html products.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "유튜브 새 영상 자동 연결 ($(date -u -d '+9 hours' +%Y-%m-%d))"
            git push
          fi
